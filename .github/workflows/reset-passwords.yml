name: Reset Passwords

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run(목록만 확인) 또는 apply(실제 변경)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      special_names:
        description: "이름 없는 계정 지정 (예: admin=홍길동,leader1=김철수)"
        required: false
        default: ""

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run password reset script
        run: node scripts/reset-passwords.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: ${{ inputs.mode }}
          SPECIAL_NAMES: ${{ inputs.special_names }}
